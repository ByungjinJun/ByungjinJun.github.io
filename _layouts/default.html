<!doctype html>
<html lang="en" data-language="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  {% include google-analytics.html %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="shell nav-shell">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Byungjin Jun home">Byungjin Jun</a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="{{ '/' | relative_url }}#research"><span data-lang="en">Research</span><span data-lang="ko">연구</span></a>
        <a href="{{ '/' | relative_url }}#publications"><span data-lang="en">Publications</span><span data-lang="ko">논문</span></a>
        <a href="{{ '/' | relative_url }}#teaching"><span data-lang="en">Teaching</span><span data-lang="ko">교육</span></a>
        <a href="{{ '/blog/' | relative_url }}"><span data-lang="en">Blog</span><span data-lang="ko">블로그</span></a>
        <a href="{{ '/files/cv.pdf' | relative_url }}">CV</a>
      </nav>
      <div class="language-switch" role="group" aria-label="Language">
        <button type="button" data-set-lang="en" class="active" aria-pressed="true">EN</button>
        <span aria-hidden="true">/</span>
        <button type="button" data-set-lang="ko" aria-pressed="false">한국어</button>
      </div>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="shell footer-shell">
      <div>
        <strong>Byungjin Jun</strong>
        <p><span data-lang="en">Department of Computer Science, Korea Military Academy</span><span data-lang="ko">육군사관학교 컴퓨터과학과</span></p>
      </div>
      <p>© <span id="year"></span> Byungjin Jun</p>
    </div>
  </footer>

  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
